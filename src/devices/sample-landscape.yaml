# 화면 크기·테마·언어가 다른 장치를 추가하는 방법을 보여주는 예시 (실제 제품 아님)
device: sample-landscape
name: 예시 - 가로형 장치
screen: 1280x800
theme: light-compact
language: ko
languages: [ko, en]

menu:
  - 홈 화면:
      type: home
      help:
        ko: 장치의 대기 화면입니다. 왼쪽 위 아이콘을 누르면 메뉴로 들어갑니다.
        en: The idle screen of the device. Tap the icon at the top left to open the menu.
      children:
        - 메뉴:
            type: button
            slot: top-left
            icon: grid
            help:
              ko: 전체 메뉴를 엽니다.
              en: Opens the full menu.
            children:
              - 설정:
                  type: bottom-tab
                  icon: settings
                  children:
                    - 일반:
                        type: top-tab
                        children:
                          - 화면:
                              type: category
                              children:
                                - 밝기:
                                    type: slide 70
                                    help:
                                      ko: 화면 밝기를 조절합니다.
                                      en: Adjusts the screen brightness.
                                - 언어:
                                    type: select
                                    help:
                                      ko: 장치 메뉴에 표시할 언어를 선택합니다.
                                      en: Selects the language of the device menu.
                                    options:
                                      - 한국어:
                                          ko: 메뉴를 한국어로 표시합니다.
                                          en: Shows the menu in Korean.
                                      - English:
                                          ko: 메뉴를 영어로 표시합니다.
                                          en: Shows the menu in English.
                                - 화면 보호기: toggle on
                    - 정보:
                        type: top-tab
                        children:
                          - 모델명: string SAMPLE-01
                          - 펌웨어: string 1.0.0
              - 나가기:
                  type: bottom-tab
                  icon: exit
                  goto: home
                  help:
                    ko: 홈 화면으로 돌아갑니다.
                    en: Returns to the home screen.
        - 출입문:
            type: button
            slot: bottom
            icon: door
            children:
              - 수동 개방
              - 수동 잠금
